<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#15131a;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body>
<script type="module">
// Developer view: renders characters with the real game code.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadAssets } from './src/assets.js';
import { makeCharacter } from './src/characters.js';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1720);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
const key = new THREE.DirectionalLight(0xfff0e0, 2.6); key.position.set(3, 5, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -2 }); scene.add(key);
const rim = new THREE.DirectionalLight(0x8fa8ff, 1.5); rim.position.set(-4, 3, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0x8090b0, 0x302018, 0.5));
const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x24212a, roughness: 0.9 }));
floor.receiveShadow = true; scene.add(floor);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
window.T = { THREE, scene, cam, r, rigs: [] };
window.setup = (list) => {
  for (const g of T.rigs) scene.remove(g.root);
  T.rigs = list.map((it, i) => { const c = makeCharacter(it.id, it.sk); c.root.position.set(it.x || 0, 0, it.z || 0); c.root.rotation.y = it.ry || 0; if (it.w) c.setWeapon(it.w); scene.add(c.root); c.st = it.st || {}; return c; });
};
window.step = (secs, dt = 1 / 30) => { const n = Math.round(secs / dt); for (let i = 0; i < n; i++) for (const c of T.rigs) { if (c.st.walkTo) c.root.position.z += c.st.walkTo * dt; c.update({ ...c.st, melee: c.st.swing ? ((T.t = (T.t || 0) + dt / T.rigs.length) * 1.2) % 1 : c.st.melee }, dt); } };
window.shot = (pos, look) => { cam.position.set(...pos); cam.lookAt(...look); r.render(scene, cam); };
loadAssets().then(() => { window.ready = true; });
</script></body></html>
